name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-smoke-test:
    name: Lint & smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (Linux, for headless Qt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Byte-compile all sources (catches syntax errors)
        run: python -m compileall -q main.py app

      - name: Headless smoke test (build the main window)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from app.ui.main_window import MainWindow; from PySide6.QtWidgets import QApplication; app = QApplication([]); w = MainWindow(); w.show(); print('MainWindow built OK')"
