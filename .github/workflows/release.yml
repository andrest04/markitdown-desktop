name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: windows
          - os: macos-latest
            asset_name: macos
          - os: ubuntu-latest
            asset_name: linux

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (Linux, for Qt + packaging)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 zip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --onedir --windowed
          --name markitdown-desktop
          --collect-all markitdown
          --collect-all magika
          main.py

      - name: Build single-file .exe (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name markitdown-desktop
          --distpath dist-onefile
          --collect-all markitdown
          --collect-all magika
          main.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/markitdown-desktop/* -DestinationPath markitdown-desktop-windows.zip

      - name: Build installer with Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & $iscc "/DMyAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          zip -r "../markitdown-desktop-${{ matrix.asset_name }}.zip" markitdown-desktop

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            markitdown-desktop-${{ matrix.asset_name }}.zip
            dist-onefile/markitdown-desktop.exe
            dist-installer/markitdown-desktop-setup.exe
          generate_release_notes: true
